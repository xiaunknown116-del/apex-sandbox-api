### Anatomy of a workflow (quick map)

| Piece | Role |
|-------|------|
| `name` | Label in the Actions tab |
| `on` | When it runs (`push`, `pull_request`, `workflow_dispatch`, …) |
| `concurrency` | Limit parallel runs; cancel superseded ones |
| `jobs.<id>` | One or more jobs (can use `needs`, matrix, etc.) |
| `runs-on` | Runner (`ubuntu-latest`, self-hosted, …) |
| `steps` | Ordered actions / shell commands |
| `uses:` | Reuse a published action |
| `run:` | Shell command on the runner |

### Common workflow types you might add later

| Type | Trigger | Purpose |
|------|---------|---------|
| **CI** (current) | push / PR | Typecheck + test |
| **Deploy** | push to `main` or `workflow_dispatch` | `wrangler deploy` with secrets |
| **Release** | tag / release | Changelog, GitHub Release |
| **Scheduled** | `schedule:` cron | Nightly health checks |
| **Reusable** | `workflow_call` | Share jobs across repos |

