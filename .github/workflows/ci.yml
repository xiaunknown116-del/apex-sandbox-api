### Current workflow (PR branch)

```yaml
name: CI                    # Actions tab label

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # manual "Run workflow"
    inputs:
      node_version:
        type: choice
        default: "24"
        options: ["22", "24"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true  # cancel older runs on same branch

jobs:
  test:
    name: Test (Node ${{ inputs.node_version || '24' }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version || '24' }}
      - run: npm install
      - run: npm run typecheck
      - run: npm test
```

